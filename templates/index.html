<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>AI Chatbot</h1>
    <p>Welcome! Ask me anything about cloud computing.</p>

    <div id="chat-box"></div>

    <input
        type="text"
        id="user-input"
        placeholder="Type your message..."
        maxlength="500"
    >

    <button id="send-btn">Send</button>

    <script>
        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");

        function addMessage(sender, message) {
            const paragraph = document.createElement("p");

            // textContent safely displays text
            paragraph.textContent = sender + ": " + message;

            chatBox.appendChild(paragraph);
        }

        async function sendMessage() {
            const message = userInput.value.trim();

            if (!message) return;

            addMessage("You", message);
            userInput.value = "";
            sendBtn.disabled = true;

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: message
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    addMessage("Bot", data.error || "Something went wrong.");
                } else {
                    addMessage("Bot", data.reply);
                }

            } catch (error) {
                addMessage("Bot", "Could not connect to the server.");
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener("click", sendMessage);

        userInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>

</body>
</html>
